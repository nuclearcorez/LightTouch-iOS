[package]
name = "lighttouch-ios-bridge"
description = "C ABI bridge from the native iOS frontend to LightTouch's shared Rust core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
lighttouch-core = { path = "../lighttouch-core", features = ["vendored-openssl"] }
serde_json = "1"
