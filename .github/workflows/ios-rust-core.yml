name: iOS Rust Core

on:
  workflow_dispatch:
  push:
    branches:
      - "ios/**"

permissions:
  contents: read

concurrency:
  group: ios-rust-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-rust-core:
    name: Cross-compile LightTouch core for iOS arm64
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain and iOS target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios
          cache: true

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build native iOS core bridge
        run: cargo build --locked -p lighttouch-ios-bridge --target aarch64-apple-ios --release

      - name: Verify static library
        run: |
          set -euo pipefail
          LIB=target/aarch64-apple-ios/release/liblighttouch_ios_bridge.a
          test -s "$LIB"
          file "$LIB"
          xcrun --sdk iphoneos nm -gU "$LIB" | grep -q '_lt_ios_context_open'

      - name: Upload iOS core bridge
        uses: actions/upload-artifact@v6
        with:
          name: LightTouch-iOS-core-arm64
          path: |
            target/aarch64-apple-ios/release/liblighttouch_ios_bridge.a
            crates/lighttouch-ios-bridge/include/lighttouch_ios_bridge.h
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Cargo diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-rust-core-diagnostics
          path: |
            target/aarch64-apple-ios/release/build/**
            target/aarch64-apple-ios/release/.fingerprint/**
          if-no-files-found: ignore
          retention-days: 7
